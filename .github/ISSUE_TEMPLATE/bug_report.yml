name: 🐛 Bug Report
description: Create a report to help us fix a bug in Redline Heights
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in **Redline Heights**! Please fill out the details below so we can reproduce and fix it quickly.
  - type: input
    id: version
    attributes:
      label: Game / Engine Version
      description: What Godot engine or game build version are you running?
      placeholder: "e.g., Godot 4.7.2 / macOS 15.0 or Linux / Commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Windows 11 / 10
        - Web / Browser
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When entering the taxi near the metro station, physics freeze..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `make run`
        2. Walk to coordinates (X, Z)
        3. Press 'E' to enter vehicle
        4. See crash or glitch
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Debug Output or Screenshots
      description: Paste any Godot console logs or drag-and-drop screenshots here.
      render: shell
